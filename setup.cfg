[metadata]
name = honor2apple-live
version = 0.1.0
description = Convert calibrated HONOR HDR motion photos to Apple Live Photo pairs
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = HeXiao2001

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    numpy>=1.24
    Pillow>=10
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
honor2apple = calibration.json, calibration_full_1p5.json, make_live_mov.swift

[options.entry_points]
console_scripts =
    honor2apple = honor2apple.cli:main
